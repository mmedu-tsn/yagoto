<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八事 助手のやること</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="やること">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-512.png"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f6f8b">
<style>body{font:16px system-ui,sans-serif;margin:0;padding:32px 20px;color:#333;background:#f4f6f8}p{margin:0 0 12px}</style>
</head><body><p id="m">読み込み中…</p>
<script>
// 画面の中身は Apps Script から取ってくる（ここは入口だけ）。Googleのログイン状態に左右されない
(function(){
  var EXEC="https://script.google.com/macros/s/AKfycbz9FVNZix_XkwWH58amNPbxXEeuqvHXCS2gIXb1muZWeHObupMVWSDCozX8MCwyosA/exec";
  var u=new URLSearchParams(location.search).get("u")||"";
  if(!u){document.getElementById("m").textContent="リンクが正しくありません。校舎長にリンクをもらってください。";return}
  var tries=0;
  function go(){fetch(EXEC+"?app=1&u="+encodeURIComponent(u),{credentials:"omit",redirect:"follow"}).then(function(r){return r.text()}).then(function(h){document.open();document.write(h);document.close()})
    .catch(function(){if(++tries<3)return setTimeout(go,1500);document.getElementById("m").textContent="つながりませんでした。電波の良いところで開き直してください。"})}
  go();
})();
</script></body></html>
